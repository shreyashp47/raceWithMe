<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Viewer</title>
<style>
body { margin: 0; overflow: hidden; background: #2a2a2a; }
canvas { display: block; }
#info { position:fixed; top:12px; left:50%; transform:translateX(-50%);
  color:#fff; font-family:sans-serif; font-size:14px;
  background:rgba(0,0,0,0.7); padding:6px 14px; border-radius:6px; z-index:10;
  pointer-events:none; }
.checkpoint-label { position:fixed; color:#fff; font-family:sans-serif; font-size:11px;
  background:rgba(0,0,0,0.6); padding:1px 4px; border-radius:3px; z-index:10;
  pointer-events:none; transform:translate(-50%, -100%); }
</style>
</head>
<body>
<div id="info">🖱 Drag to orbit · Scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { Track } from './src/track/Track.js'
import { Terrain } from './src/terrain/Terrain.js'
import { addEnvironmentDetail, createGroundTexture } from './src/environment/EnvironmentDetail.js'

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x87ceeb)
scene.fog = new THREE.Fog(0x87ceeb, 40, 200)

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300)
camera.position.set(0, 25, 50)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.1
document.body.prepend(renderer.domElement)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0, 0)
controls.update()

const ambient = new THREE.AmbientLight(0xffffff, 0.6)
scene.add(ambient)

const dir = new THREE.DirectionalLight(0xfff4e0, 2.2)
dir.position.set(40, 60, 20)
dir.castShadow = true
dir.shadow.mapSize.set(1024, 1024)
dir.shadow.camera.left = -60
dir.shadow.camera.right = 60
dir.shadow.camera.top = 60
dir.shadow.camera.bottom = -60
scene.add(dir)

const hemi = new THREE.HemisphereLight(0xaee2ff, 0x4a3a2a, 0.6)
scene.add(hemi)

const track = new Track()
scene.add(track.mesh)

const terrain = new Terrain(200, 100, track.spline)
scene.add(terrain.mesh)

const isOnTrack = (x, z) => {
  let minDist = Infinity
  for (let t = 0; t <= 1; t += 0.02) {
    const p = track.spline.getPoint(t)
    const d = Math.sqrt((p.x - x) ** 2 + (p.z - z) ** 2)
    if (d < minDist) minDist = d
  }
  return minDist < track.width * 0.6
}
const env = addEnvironmentDetail(scene, (x, z) => terrain.getHeight(x, z), isOnTrack)

const checkpointLabels = []
track.checkpoints.forEach(cp => {
  const label = document.createElement('div')
  label.className = 'checkpoint-label'
  label.textContent = cp.index
  document.body.appendChild(label)
  checkpointLabels.push({ label, cp })
})
grid.position.y = -0.01
scene.add(grid)

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

function updateCheckpointLabels() {
  const halfW = innerWidth / 2
  const halfH = innerHeight / 2
  for (const { label, cp } of checkpointLabels) {
    const pos = cp.mesh.position.clone()
    pos.y = 1.5
    pos.project(camera)
    const x = (pos.x * halfW) + halfW
    const y = -(pos.y * halfH) + halfH
    label.style.left = x + 'px'
    label.style.top = y + 'px'
    label.style.display = pos.z < 1 ? '' : 'none'
  }
}

function animate() {
  requestAnimationFrame(animate)
  updateCheckpointLabels()
  renderer.render(scene, camera)
}
animate()
</script>
</body>
</html>
