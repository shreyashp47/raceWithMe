<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Viewer</title>
<style>
body { margin: 0; overflow: hidden; background: #2a2a2a; }
canvas { display: block; }
#info { position:fixed; top:12px; left:50%; transform:translateX(-50%);
  color:#fff; font-family:sans-serif; font-size:14px;
  background:rgba(0,0,0,0.7); padding:6px 14px; border-radius:6px; z-index:10;
  pointer-events:none; }
</style>
</head>
<body>
<div id="info">🖱 Drag to orbit · Scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { Track } from './src/track/Track.js'

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x1a2a1a)

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100)
camera.position.set(0, 18, 22)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
document.body.prepend(renderer.domElement)

const controls = new OrbitControls(camera, renderer.domElement)
controls.target.set(0, 0, 0)
controls.update()

const ambient = new THREE.AmbientLight(0xffffff, 0.5)
scene.add(ambient)

const dir = new THREE.DirectionalLight(0xffffff, 1.2)
dir.position.set(10, 20, 10)
scene.add(dir)

const track = new Track()
scene.add(track.mesh)

// Show spline control points
const points = [
  new THREE.Vector3(0, 0, -16),
  new THREE.Vector3(10, 0, -14),
  new THREE.Vector3(16, 0, -8),
  new THREE.Vector3(14, 0, 0),
  new THREE.Vector3(16, 0, 8),
  new THREE.Vector3(10, 0, 14),
  new THREE.Vector3(0, 0, 16),
  new THREE.Vector3(-4, 0, 8),
  new THREE.Vector3(-8, 0, 4),
  new THREE.Vector3(-4, 0, -4),
  new THREE.Vector3(-8, 0, -8),
  new THREE.Vector3(-12, 0, -12),
]

// Ground plane (grid)
const grid = new THREE.GridHelper(40, 20, 0x3a5a3a, 0x2a4a2a)
grid.position.y = -0.01
scene.add(grid)

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

function animate() {
  requestAnimationFrame(animate)
  renderer.render(scene, camera)
}
animate()
</script>
</body>
</html>
